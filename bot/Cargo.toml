[package]
name = "mememachine-rs"
version = "0.1.10"
edition = "2024"
authors = ["klevente"]
description = "A Discord soundboard bot"
repository = "https://github.com/klevente/mememachine-rs"
license = "MIT"
keywords = ["discord", "soundboard", "bot"]

[dependencies]
anyhow = "1.0.104"
async-sqlite = "0.6.0"
rand = "0.10.2"
songbird = "0.6.0"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-futures = "0.2.5"
uuid = { version = "1.26.1", features = ["v4"] }

[dependencies.serenity]
version = "0.12.4"
features = ["cache", "voice", "http", "rustls_backend"]
default-features = false

[dependencies.symphonia]
version = "0.5.5"
features = ["mp3"]

[dependencies.tokio]
version = "1.53.1"
features = ["macros", "rt-multi-thread"]

[profile.release]
lto = "fat"
strip = "debuginfo"
